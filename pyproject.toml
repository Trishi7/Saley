[project]
name = "saley"
version = "2.0.0"
description = "Saley v2: sales lead and chief-of-staff system for Membrane's sales team."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "anthropic==1.15.0",
    "apscheduler==3.11.3",
    "discord-py==2.7.1",
    "fastapi==0.143.5",
    "feedparser==6.0.14",
    "google-auth==2.62.0",
    "gspread==6.2.1",
    "httpx==0.28.1",
    "httpx2==2.13.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pypdf==6.21.1",
    "pyyaml==6.0.3",
    "sqlalchemy==2.1.5",
    "structlog==26.1.0",
    "tenacity==9.2.1",
    "typer==0.27.3",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
]

[project.scripts]
saley = "saley.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saley"]
# The dashboard v2 build is gitignored (D145), and hatch skips ignored files: list it here so a
# wheel built after `npm --prefix web run build` carries it.
artifacts = ["src/saley/web/dist/**"]

[dependency-groups]
dev = [
    "playwright==1.64.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "vulture==2.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Claude Code tooling (hooks) is not product code.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S608"]
# WHERE fragments come only from fixed dicts in this file; every value is a bound parameter.
"src/saley/web/queries.py" = ["S608"]
# Pydantic copies a mutable default per instance. Ruff cannot see that `Out` is a BaseModel
# once it is imported from another module.
"src/saley/web/schemas/*.py" = ["RUF012"]
# Same rule: the WHERE text is fixed in the file (bound cast(:x) is null checks and constants).
"src/saley/web/team.py" = ["S608"]
"src/saley/intel/decisions.py" = ["S608"]
"src/saley/intel/proposals.py" = ["S608"]
# Same rule: view names come from a fixed dict, WHERE fragments are fixed text, values are bound.
"src/saley/web/signals.py" = ["S608"]
"src/saley/web/seen_tabs.py" = ["S608"]
# Fixed SQL text built from constants; the only value is a bound date.
"src/saley/qa/sheet_verify.py" = ["S608"]
# Same rule: the QA markers are constants in this file; no request value reaches the SQL.
"src/saley/qa/seed.py" = ["S608"]
# Fixed SQL text only: no value from a user or a request reaches a migration.
"migrations/**" = ["E501", "S608"]
# Report-building checks with long Markdown lines.
"scripts/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
