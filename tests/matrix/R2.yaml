# Test matrix R2 (docs/16-verification-standard.md §3). Never edit a row to make it pass;
# a wrong row is a docs/QUESTIONS.md entry. Feature ids match docs/plans/R2.md.
# Write tests touch only the scratch tab SALEY_TEST in the sheet copy, never Outreach PoCs rows.
release: R2
rows:
  - id: R2-W01
    feature: F-R2-01
    layer: sheet
    what: write round trip on a fake sheet - cell + decision row + Name note, read back equal
    tool: pytest
    command: pytest tests/test_writer.py::test_write_round_trip_cell_decision_and_note
    pass: test passes
  - id: R2-W02
    feature: F-R2-01
    layer: sheet
    what: live round trip in SALEY_TEST - create tab, write, read back, undo, delete tab (always)
    tool: shell
    command: python -m saley.cli sheet roundtrip --test-tab
    writes: test_tab
    pass: exit 0 with values read back equal and the tab deleted; exit 3 NOT CONFIGURED with a Q id = PENDING
  - id: R2-W03
    feature: F-R2-02
    layer: unit
    what: undo inside UNDO_MINUTES restores the old value; after the window it is refused
    tool: pytest
